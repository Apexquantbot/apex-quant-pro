name: Actualizar datos

on:
  # Las horas las marca cron-job.org (10:37, 15:37, 18:37 y 22:37, de lunes a viernes),
  # porque las tareas programadas de GitHub no se estaban lanzando.
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo enviar una notificación de prueba (no actualiza datos)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Analizar acciones
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PRUEBA: ${{ inputs.prueba }}
        run: python analizar.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Datos actualizados" || exit 0
          git pull --rebase
          git push
